# This workflow runs tests from the `tests` directory using pytest and logs results to MLflow. 
# It runs on Python 3.10, 3.11, and 3.12.
name: Tests with MLflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_TRACKING_TOKEN: ${{ secrets.MLFLOW_TRACKING_TOKEN }}
      MLFLOW_EXPERIMENT_NAME: ${{ secrets.MLFLOW_EXPERIMENT_NAME }}
      PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install mlflow pandas opencv-python-headless tqdm

      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          mkdir -p test-results
          pytest tests --junitxml=test-results/pytest.xml

      - name: Log test results to MLflow
        if: always()
        run: |
          python scripts/log_pytest_to_mlflow.py test-results/pytest.xml

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-python-${{ matrix.python-version }}
          path: test-results/pytest.xml
          if-no-files-found: warn

      - name: Upload offline MLflow runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-python-${{ matrix.python-version }}
          path: mlruns/
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: steps.pytest.outcome != 'success'
        run: exit 1
